# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[graph]
# Reject duplicate versions of the same crate.
all-features = false

[licenses]
# We use BUSL-1.1 for the project. Allow common permissive and copyleft licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BUSL-1.1",
]
# BUSL-1.1 is our own license; allow it for our crates.
confidence-threshold = 0.8

[bans]
# Deny duplicate versions of the same crate.
multiple-versions = "deny"
# Deny wildcard dependencies.
wildcards = "allow"

# Duplicate versions permitted only where two upstream ecosystems have not
# converged and we cannot unify them without vendoring a dependency. Each entry
# states why it is tolerable. Review this list whenever dependencies are bumped;
# an entry that no longer produces a duplicate should be deleted, not left to
# mask a future one.
skip = [
    # The RustCrypto AEAD and curve crates still depend on getrandom 0.2, while
    # blake3 and our own direct use are on 0.3. Both are thin wrappers over the
    # same OS entropy source, so the duplicate costs binary size rather than
    # correctness: there is no second userspace PRNG state and no key material
    # is generated by the 0.2 copy. Removing it requires upstream releases we do
    # not control.
    { crate = "getrandom@0.2", reason = "RustCrypto stack has not migrated to getrandom 0.3" },

    # Same split, one layer down: chacha20, curve25519-dalek, and poly1305 pin
    # cpufeatures 0.2 while blake3 uses 0.3. cpufeatures only performs CPU
    # feature detection for choosing SIMD backends and holds no state that
    # matters to correctness.
    { crate = "cpufeatures@0.2", reason = "RustCrypto stack has not migrated to cpufeatures 0.3" },

    # syn is a proc-macro dependency used at build time only and never linked
    # into the shipped binaries, so a duplicate has no effect on the artifacts
    # covered by the reproducible-build and SBOM gates.
    { crate = "syn@2", reason = "build-time proc-macro dependency, not linked into release artifacts" },
]

[advisories]
# Deny known security vulnerabilities.
ignore = [
    # Add advisory IDs to ignore here with justification.
]
