# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[graph]
# Reject duplicate versions of the same crate.
all-features = false

[licenses]
# We use BUSL-1.1 for the project. Allow common permissive and copyleft licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BUSL-1.1",
]
# BUSL-1.1 is our own license; allow it for our crates.
confidence-threshold = 0.8

[bans]
# Deny duplicate versions of the same crate.
multiple-versions = "deny"
# Deny wildcard dependencies.
wildcards = "allow"

# Duplicate versions permitted only where two upstream ecosystems have not
# converged and we cannot unify them without vendoring a dependency. Each entry
# states why it is tolerable. Review this list whenever dependencies are bumped;
# an entry that no longer produces a duplicate should be deleted, not left to
# mask a future one.
skip = [
    # ed25519-dalek's digest stack is on the RustCrypto traits at 0.10, while
    # chacha20poly1305 0.11 moved to their successors. Both copies are
    # trait-and-buffer plumbing - block-buffer holds partial input between
    # update calls, crypto-common defines the key and IV traits - and neither
    # contains a primitive. Closing the split needs an ed25519-dalek release on
    # the new traits, which is not ours to make.
    #
    # These arrived with the chacha20poly1305 0.11 bump and replaced the
    # getrandom 0.2 duplicate, which that bump resolved. Deleted rather than
    # left behind, per the note above.
    { crate = "block-buffer@0.10", reason = "ed25519-dalek's digest stack has not migrated to the 0.12 traits" },
    { crate = "crypto-common@0.1", reason = "ed25519-dalek's digest stack has not migrated to the 0.2 traits" },

    # A third split, one layer down: chacha20, curve25519-dalek, and poly1305 pin
    # cpufeatures 0.2 while blake3 uses 0.3. cpufeatures only performs CPU
    # feature detection for choosing SIMD backends and holds no state that
    # matters to correctness.
    { crate = "cpufeatures@0.2", reason = "RustCrypto stack has not migrated to cpufeatures 0.3" },

    # syn is a proc-macro dependency used at build time only and never linked
    # into the shipped binaries, so a duplicate has no effect on the artifacts
    # covered by the reproducible-build and SBOM gates.
    { crate = "syn@2", reason = "build-time proc-macro dependency, not linked into release artifacts" },
]

# Crates that open sockets.
#
# Section 3 of the master spec says "any dependency that opens a socket in the
# data path is a build failure" and CI enforces it. It did not: cargo deny
# checks licenses, advisories, and duplicate versions, and nothing looked at
# what the dependencies do. This is that enforcement, added in Phase 39.
#
# It lives here rather than in a source scan because cargo deny walks the
# *resolved* graph. A scan of Cargo.toml would see only what this workspace
# names directly, and the way a networking crate actually arrives is three
# levels down inside something that added a feature.
#
# The list is the common transports and the async runtimes that carry them,
# rather than an attempt at completeness, which is not achievable. It is a
# tripwire on the paths a dependency actually takes to reach a socket.
# scripts/security_lint.py checks this list still names each of them, so the
# two cannot drift apart.
deny = [
    { crate = "tokio", reason = "async runtime; the usual carrier for a socket" },
    { crate = "hyper", reason = "HTTP" },
    { crate = "reqwest", reason = "HTTP client" },
    { crate = "ureq", reason = "HTTP client" },
    { crate = "curl", reason = "HTTP client" },
    { crate = "mio", reason = "the epoll/kqueue layer under most Rust networking" },
    { crate = "socket2", reason = "raw socket configuration" },
    { crate = "tungstenite", reason = "WebSockets" },
    { crate = "quinn", reason = "QUIC" },
    { crate = "rustls", reason = "TLS; nothing here should be speaking TLS" },
    { crate = "native-tls", reason = "TLS" },
    { crate = "openssl", reason = "TLS, and a second cryptographic stack" },
]

[advisories]
# Deny known security vulnerabilities.
ignore = [
    # Add advisory IDs to ignore here with justification.
]
