# golangci-lint configuration for Dhow CLI
# https://golangci-lint.run/

version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - misspell

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  revive:
    severity: warning
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

run:
  timeout: 5m
  tests: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocritic
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
