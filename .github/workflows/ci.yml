name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The Rust workspace lives in core/, not at the repository root, so every cargo
# step carries `working-directory: core`. Without it cargo exits with "could not
# find Cargo.toml" and the gate never runs at all.
jobs:
  rustfmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: core

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
        working-directory: core

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: core

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
        working-directory: core

  # Every Go job below links against the Rust staticlib through cgo, so the
  # core must be built first. Without it the linker fails on -ldhow_ffi with an
  # error that says nothing about the real cause.
  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: cargo build --release -p dhow-ffi
        working-directory: core
      - run: go vet ./cli/...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: cargo build --release -p dhow-ffi
        working-directory: core
      - run: go build ./cli/...

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: cargo build --release -p dhow-ffi
        working-directory: core
      - run: go test -race ./cli/...

  govulncheck:
    name: Go Vuln Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: cargo build --release -p dhow-ffi
        working-directory: core
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./cli/...

  golangci-lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: cargo build --release -p dhow-ffi
        working-directory: core
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  drill:
    name: Operations Guide Drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - run: scripts/drill.sh

  chaos:
    name: Chaos Soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      # A larger round count than the local gate runs, with a seed that varies
      # by run number, so CI searches a little rather than re-checking one
      # fixed sequence forever. The seed is printed on failure.
      - run: scripts/chaos.sh 40 "${{ github.run_number }}"

  spec-check:
    name: Wire-Format Spec Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/gen_vectors.py
      - run: python3 scripts/check_spec.py
