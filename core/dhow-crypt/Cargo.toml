[package]
name = "dhow-crypt"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1"
chacha20poly1305 = "0.10"
dhow-codec = { version = "0.1.0", path = "../dhow-codec" }
ed25519-dalek = "2"
getrandom = "0.3"
subtle = "2"
thiserror = "2.0"
zeroize = "1"

[dev-dependencies]
dhow-codec = { path = "../dhow-codec" }
# Property tests for the crypto layer. dhow-codec has had them since Phase 5
# and this crate had none, which was the wrong way round: the codec's failure
# mode is a dataset that does not reassemble, and this one's is a dataset that
# reassembles into something an attacker chose.
proptest = "1"
